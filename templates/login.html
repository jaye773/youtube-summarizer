<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - YouTube Summarizer</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            line-height: 1.6; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .container { 
            max-width: 400px; 
            width: 100%; 
            background-color: #fff; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center;
        }
        h1 { 
            color: #2c3e50; 
            margin-bottom: 10px; 
            font-size: 28px;
        }
        .subtitle { 
            color: #7f8c8d; 
            margin-bottom: 30px; 
            font-size: 16px;
        }
        .form-group { 
            margin-bottom: 20px; 
            text-align: left;
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #2c3e50; 
            font-weight: 500;
        }
        input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border-radius: 6px; 
            border: 1px solid #ccc; 
            font-size: 16px; 
            box-sizing: border-box; 
            transition: border-color 0.3s;
        }
        input[type="password"]:focus { 
            outline: none; 
            border-color: #8e44ad; 
            box-shadow: 0 0 0 2px rgba(142, 68, 173, 0.2);
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background-color: #8e44ad; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background-color 0.3s; 
            margin-top: 10px;
        }
        button:hover { 
            background-color: #732d91; 
        }
        button:disabled { 
            background-color: #bdc3c7; 
            cursor: not-allowed; 
        }
        .error-message { 
            background-color: #fbeeee; 
            color: #c0392b; 
            padding: 12px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            border-left: 4px solid #e74c3c;
            text-align: left;
        }
        .info-message { 
            background-color: #eef7ff; 
            color: #2980b9; 
            padding: 12px; 
            border-radius: 6px; 
            margin-bottom: 20px; 
            border-left: 4px solid #3498db;
            text-align: left;
        }
        .footer-link { 
            margin-top: 20px; 
            color: #7f8c8d; 
            font-size: 14px;
        }
        .footer-link a { 
            color: #8e44ad; 
            text-decoration: none;
        }
        .footer-link a:hover { 
            text-decoration: underline;
        }
        .loading { 
            display: none; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Login Required</h1>
        <p class="subtitle">Please enter your passcode to access the YouTube Summarizer</p>
        
        <div id="error-container"></div>
        <div id="info-container"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="passcode">Passcode:</label>
                <input type="password" id="passcode" name="passcode" required autofocus 
                       placeholder="Enter your passcode">
            </div>
            
            <button type="submit" id="login-btn">
                <span class="button-text">Login</span>
                <span class="loading">Logging in...</span>
            </button>
        </form>
        
        <div class="footer-link">
            Need help? Check your environment configuration.
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
