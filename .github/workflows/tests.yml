name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is what the Docker image runs; 3.9 is the oldest version still used
        # for local development (EOL; drop it once local setups move on).
        python-version: ["3.9", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run linting
      run: |
        flake8 app.py ai_models.py auth.py cache.py sse.py summary_jobs.py tts_helpers.py youtube_helpers.py \
          voice_config.py gunicorn_config.py --max-line-length=120 --exclude=venv,__pycache__

    - name: Run tests with coverage
      env:
        GOOGLE_API_KEY: test_api_key
        TESTING: true
      run: |
        pytest --cov=app --cov=ai_models --cov=auth --cov=cache --cov=tts_helpers \
          --cov=youtube_helpers --cov=voice_config --cov=sse \
          --cov-report=xml --cov-report=term-missing -v

    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  browser:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies and Chromium
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt playwright==1.64.1
        python -m playwright install --with-deps chromium

    - name: Run browser smoke tests
      env:
        GOOGLE_API_KEY: test_api_key
        TESTING: true
      run: |
        pytest tests/test_browser_smoke.py -v

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build image
      run: docker build -t youtube-summarizer:ci .

    - name: Smoke test /health
      run: |
        docker run -d --name app -p 5001:5001 youtube-summarizer:ci
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:5001/health; then exit 0; fi
          sleep 2
        done
        docker logs app
        exit 1
