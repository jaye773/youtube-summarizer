services:
  summarizer-app:
    build: .
    container_name: youtube-summarizer
    ports:
      - "5001:5001"
    # All configuration (API keys, LOGIN_*, TRUST_PROXY_HOPS, ...) comes from .env.
    # See README "Configuration" for the full list.
    env_file:
      - path: .env
        required: false
    environment:
      - DATA_DIR=/app/data
    volumes:
      # Summary cache, audio cache, login attempts, session secret and
      # settings saved from the UI all live here. With Podman on SELinux
      # hosts, append :Z to this mount.
      - ./data:/app/data
    restart: unless-stopped
